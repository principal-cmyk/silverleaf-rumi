# principal-cmyk/silverleaf-rumi — WhatsApp bot service root.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway execs this without a shell, so && never reaches the bot.
startCommand = "node bin/rumi.js start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
